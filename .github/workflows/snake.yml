name: generate animated snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ThutaGaming
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ff0000&color_dots=0d0000,3f0a0a,6e0000,a30000,ff0000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=ff0000

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
